name: Ask preflight Linux validation
on:
  push:
    branches: [test/ask-preflight-linux-validation]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab5c9453dcdab0faf584a05d9dd854400a8dd2cc
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply reviewed regression patch
        env:
          REVIEW_PATCH: 
        run: |
          python - <<'PY'
          import os,base64,subprocess
          subprocess.run(['git','apply','-'],input=base64.b64decode(os.environ['REVIEW_PATCH']),check=True)
          PY
      - name: Install repository test and optional typecheck dependencies
        run: uv sync --frozen --extra treesitter-full --extra semantic --extra milvus --extra test --extra neo4j --group dev
      - name: Repository pre-commit
        run: uv run --frozen --no-sync pre-commit run --files codebase_rag/cli.py codebase_rag/tests/test_cli_startup_errors.py codebase_rag/tests/test_half_configured_model_role.py
      - name: Focused CLI and model regression
        run: uv run --frozen --no-sync pytest codebase_rag/tests/test_cli_startup_errors.py codebase_rag/tests/test_half_configured_model_role.py codebase_rag/tests/test_config_validation.py codebase_rag/tests/test_single_query_output_format.py codebase_rag/tests/test_cli_autosync.py -q --no-cov
